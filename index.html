<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>Peg Scan</title>
<style>
  :root { --bg:#0b0d10; --card:#161a20; --line:#2c3442; --text:#f4f6f8; --muted:#9aa3b2; --gold:#e2b340; --silver:#d5dbe3; --green:#3dd68c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
  header { padding: calc(8px + env(safe-area-inset-top)) 14px 8px; display:flex; justify-content:space-between; align-items:flex-end; }
  h1 { margin:0; font-size:18px; } h1 span { color:var(--gold); }
  .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  .count { font-size:13px; color:var(--muted); }
  .stage { position:relative; margin:0 12px; border-radius:16px; overflow:hidden; background:#000; height:46dvh; }
  video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .cross { position:absolute; inset:18% 22%; border:2px solid rgba(226,179,64,.7); border-radius:12px; pointer-events:none; }
  .toast { position:absolute; left:10px; right:10px; top:10px; background:rgba(10,12,16,.88); border:1px solid rgba(226,179,64,.45); color:var(--gold); border-radius:12px; padding:8px 10px; font-size:13px; font-weight:700; display:none; }
  .controls { display:flex; gap:8px; padding:10px 12px; }
  button { flex:1; border:0; border-radius:999px; background:#222833; color:var(--text); font:inherit; font-size:15px; font-weight:700; padding:13px 10px; }
  button.primary { background:var(--gold); color:#1a1406; }
  button.capture { background:var(--green); color:#06200f; flex:1.4; }
  button:disabled { opacity:.4; }
  .err { color:#ffb4ae; font-size:13px; padding:0 14px 6px; }
  #list { padding:0 12px calc(18px + env(safe-area-inset-bottom)); }
  .item { display:flex; gap:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:8px; margin-bottom:8px; }
  .item img { width:92px; height:70px; object-fit:cover; border-radius:8px; background:#000; flex:none; }
  .name { font-weight:750; font-size:14px; }
  .meta { color:var(--muted); font-size:12px; margin-top:3px; line-height:1.35; }
  .badge { display:inline-block; margin-top:6px; font-size:10px; font-weight:800; letter-spacing:.04em; border-radius:999px; padding:3px 7px; }
  .SUPER { background:var(--gold); color:#1a1406; }
  .TH { background:var(--silver); color:#1a1406; }
  .RED { background:#ff5a4e; color:#fff; }
  .NO { background:#2a3140; color:#c9d0da; }
  .UNK { background:#3a3320; color:var(--gold); }
  .empty { color:var(--muted); font-size:13px; line-height:1.4; padding:4px 2px 12px; }
</style>
</head>
<body>
<header>
  <div><h1>Peg <span>Scan</span></h1><div class="sub">Aim at a card. Tap Capture. Photo saves first.</div></div>
  <div class="count" id="count">0 saved</div>
</header>
<div id="err" class="err" hidden></div>
<div class="stage">
  <video id="video" playsinline muted autoplay></video>
  <div class="cross"></div>
  <div class="toast" id="toast"></div>
</div>
<div class="controls">
  <button class="primary" id="startBtn" type="button">Start camera</button>
  <button class="capture" id="shotBtn" type="button" disabled>Capture</button>
  <button id="torchBtn" type="button" disabled>Light</button>
</div>
<div id="list"><p class="empty">Point the gold box at a card or a sliver and tap Capture. The photo is saved immediately. You still check the gold flame.</p></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const CATALOG = [
  ["kia ev6","Custom Kia EV6","HW EV","NO","2025 · 8/10 · common"],
  ["ev6","Custom Kia EV6","HW EV","NO","2025 · 8/10"],
  ["hw ev 8/10","Custom Kia EV6","HW EV","NO","2025 pearl teal"],
  ["8/10","Custom Kia EV6","HW EV","NO","check year/teal"],
  ["ferrari f40","Ferrari F40 Competizione","Ferrari","SUPER","63/250"],
  ["mustang gtd","Ford Mustang GTD","Factory Fresh","SUPER","43/250"],
  ["94 toyota supra","'94 Toyota Supra","Tooned","SUPER","K case"],
  ["ram 1500","'23 Ram 1500","HW Dirt","SUPER","N case"],
  ["purple passion","Tooned Purple Passion","HW Dream Garage","NO","not rare"],
  ["mazda rx-3","Mazda RX-3","Tooned","NO","4/10"],
  ["pagani zonda","Pagani Zonda Cinque","Exoticars","NO","not rare"]
];
const video = document.getElementById("video");
const toast = document.getElementById("toast");
const err = document.getElementById("err");
const list = document.getElementById("list");
const count = document.getElementById("count");
const startBtn = document.getElementById("startBtn");
const shotBtn = document.getElementById("shotBtn");
let stream = null, torchOn = false, saved = 0, reading = false;
function norm(s){return (s||"").toLowerCase().replace(/[^a-z0-9]+/g," ").replace(/\s+/g," ").trim();}
function matchText(text){
  const n = norm(text);
  // Multi-trait for EV6
  if ((n.includes("hw ev") || n.includes("ev")) && (n.includes("8/10") || n.includes("8 10") || n.includes("120/250") || n.includes("2025"))) {
    return { name: "Custom Kia EV6", series: "HW EV", kind: "NO", note: "2025 · 8/10 · common mainline. Check flame." };
  }
  if (n.includes("kia") && n.includes("ev")) return { name: "Custom Kia EV6", series: "HW EV", kind: "NO", note: "common" };
  let best = null;
  for (const row of CATALOG) if (n.includes(row[0]) && (!best || row[0].length > best[0].length)) best = row;
  if (best) return { name: best[1], series: best[2], kind: best[3], note: best[4] || "Check the flame." };
  return { name: "Check card", series: "Unknown", kind: "UNK", note: "Photo saved. Tilt for the gold flame." };
}
function say(msg){toast.style.display="block";toast.textContent=msg;clearTimeout(say._t);say._t=setTimeout(()=>toast.style.display="none",1800);}
async function startCamera(){err.hidden=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});video.srcObject=stream;await video.play();startBtn.disabled=true;shotBtn.disabled=false;const caps=stream.getVideoTracks()[0].getCapabilities?.();document.getElementById("torchBtn").disabled=!(caps&&caps.torch);say("Aim the box. Tap Capture.");}catch(e){err.hidden=false;err.textContent="Open in Safari and allow Camera.";}}
async function toggleTorch(){torchOn=!torchOn;try{await stream.getVideoTracks()[0].applyConstraints({advanced:[{torch:torchOn}]});document.getElementById("torchBtn").textContent=torchOn?"Light on":"Light";}catch(e){torchOn=false;}}
function addItem(url,hit){if(list.querySelector(".empty"))list.innerHTML="";saved++;count.textContent=saved+" saved";const el=document.createElement("div");el.className="item";el.innerHTML=`<img alt="" src="${url}"><div class="body"></div>`;list.prepend(el);fill(el,hit);return el;}
function fill(el,hit){const label=hit.kind==="SUPER"?"SUPER":hit.kind==="TH"?"TREASURE HUNT":hit.kind==="RED"?"RED EDITION":hit.kind==="NO"?"NOT RARE":"CHECK CARD";el.querySelector(".body").innerHTML=`<div class="name">${hit.name}</div><div class="meta">${hit.series}<br>${hit.note}</div><div class="badge ${hit.kind}">${label}</div>`;}
async function capture(){if(!video.videoWidth)return;const sw=video.videoWidth,sh=video.videoHeight;const x=Math.floor(sw*0.18),y=Math.floor(sh*0.14),w=Math.floor(sw*0.64),h=Math.floor(sh*0.72);const snap=document.createElement("canvas");snap.width=w;snap.height=h;snap.getContext("2d").drawImage(video,x,y,w,h,0,0,w,h);const url=snap.toDataURL("image/jpeg",0.9);const row=addItem(url,{name:"Saved",series:"Reading",kind:"UNK",note:"Photo is in."});say("Saved");if(reading)return;reading=true;let text="";try{if(window.Tesseract){const r=await Promise.race([Tesseract.recognize(url,"eng"),new Promise((_,rej)=>setTimeout(()=>rej(new Error("slow")),7000))]);text=r.data?.text||"";}}catch(e){}fill(row,text.trim()?matchText(text):{name:"Check card",series:"Unknown",kind:"UNK",note:"Could not read the name. Check the flame."});reading=false;}
startBtn.addEventListener("click",startCamera);
document.getElementById("torchBtn").addEventListener("click",toggleTorch);
shotBtn.addEventListener("click",capture);
</script>
</body>
</html>
